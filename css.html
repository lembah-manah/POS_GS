<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f5f7; color: #111827; }

  .center-box {
    max-width: 320px; margin: 80px auto; padding: 24px;
    background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    text-align: center;
  }
  .center-box .hint { font-size: 12px; color: #6b7280; margin-top: -8px; }
  .center-box input, .center-box button { width: 100%; padding: 10px; margin: 6px 0; font-size: 14px; border-radius: 4px; border: 1px solid #d1d5db; }
  .center-box button { background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: bold; }
  .center-box button:hover { background: #1d4ed8; }
  .error-msg { color: #dc2626; font-size: 13px; min-height: 16px; }

  .app-header {
    background: #111827; color: #fff; padding: 12px 16px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .app-header .badge { background: #2563eb; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  .app-header button { margin-left: auto; padding: 6px 14px; border: none; border-radius: 4px; background: #ef4444; color: #fff; cursor: pointer; }

  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .warn { color: #b91c1c; font-size: 12px; font-weight: normal; }
  .confirm-row { display: block; font-size: 13px; margin: 8px 0; }
  #restoreSection input[type="text"], #restoreSection input:not([type]) { width: 100%; padding: 8px; margin-bottom: 6px; border: 1px solid #d1d5db; border-radius: 4px; }
  #restoreResult { font-size: 13px; margin-top: 6px; color: #374151; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; background: #fff; }
  th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 14px; }
  th { background: #f9fafb; }
</style>
